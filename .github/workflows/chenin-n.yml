name: Akile Daily Check-in

on:
  schedule:
    # 北京時間每天 09:00 = UTC 每天 01:00
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run check-in and capture log
        id: run_checkin
        env:
          AKILE_EMAIL: ${{ secrets.AKILE_EMAIL }}
          AKILE_PASSWORD: ${{ secrets.AKILE_PASSWORD }}
          AKILE_PUSH_KEY: ${{ secrets.AKILE_PUSH_KEY }}
        run: |
          # 暫時關閉 set -e 避免 Python 失敗時立刻中斷 Step
          set +e
          python Akile-Checkin.py 2>&1 | tee checkin.log
          PY_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # 抓取包含漢字 (Unicode 4E00-9FA5) 的行
          CHINESE_LOG=$(grep -P "[\x{4e00}-\x{9fa5}]" checkin.log || echo "未抓取到中文日誌")

          # 寫入 GitHub Actions 環境變數
          {
            echo "CHECKIN_MSG<<EOF"
            echo "$CHINESE_LOG"
            echo "EOF"
          } >> $GITHUB_ENV

          # 若 Python 腳本執行失敗，在記錄完 Log 後拋出錯誤讓 Step 標記為失敗
          if [ $PY_EXIT_CODE -ne 0 ]; then
            echo "Python script failed with exit code $PY_EXIT_CODE"
            exit $PY_EXIT_CODE
          fi

      - name: Send Notification to Google Chat
        if: always()
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
        run: |
          # 根據執行狀態決定標頭
          if [ "${{ job.status }}" == "success" ]; then
            HEADER="✅ *Akile 每日簽到結果*"
          else
            HEADER="❌ *Akile 每日簽到失敗*"
          fi

          LOG_LINK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Google Chat 超連結格式為 <URL|Text>
          MESSAGE="${HEADER}

\`\`\`
${{ env.CHECKIN_MSG }}
\`\`\`

<${LOG_LINK}|檢視 GitHub Actions 完整 Log>"

          # 使用 jq 包裝為 JSON payload
          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text}')

          # 發送 POST 請求至 Google Chat Webhook
          curl -H 'Content-Type: application/json' \
               -X POST \
               -d "$PAYLOAD" \
               "$GOOGLE_CHAT_WEBHOOK"
